name: gitleaks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Weekly scan to catch new secrets from contributors
    - cron: '0 6 * * 1'

jobs:
  scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history needed for thorough scan
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          # Scan all commits in the repo, not just the range between
          # the previous and current head. Required after a force-push
          # that rewrites history (the previous head may be an orphan
          # or root commit with no parent, breaking the default
          # `git log <prev>^..<new> --first-parent` invocation).
          # Slightly slower but more robust.
          log-opts: '--all'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Upload SARIF report for GitHub Code Scanning alerts
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true
